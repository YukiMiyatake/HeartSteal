name: Ship feature branch

on:
  push:
    branches: ['cursor/**']

concurrency:
  group: ship-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  rebase-ci-merge:
    name: Rebase, CI, merge to main
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch main
        run: git fetch origin main:main

      - name: Rebase onto main (path-safe conflict auto-resolve)
        id: rebase
        run: |
          set -euo pipefail

          if git rebase main; then
            echo "rebase_ok=true" >> "$GITHUB_OUTPUT"
            echo "Rebase clean"
            exit 0
          fi

          echo "Rebase conflicted — attempting path-safe auto-resolve"
          # During rebase: ours = main, theirs = feature commit
          both=0
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            stage2=$(git ls-files -u -- "$path" | awk '$2==2 {print}' | wc -l)
            stage3=$(git ls-files -u -- "$path" | awk '$2==3 {print}' | wc -l)

            if [[ "$stage2" -gt 0 && "$stage3" -gt 0 ]]; then
              echo "Both sides modified: $path"
              both=1
              continue
            fi
            if [[ "$stage3" -gt 0 ]]; then
              git checkout --theirs -- "$path"
              git add -- "$path"
              echo "Kept feature version: $path"
            elif [[ "$stage2" -gt 0 ]]; then
              git checkout --ours -- "$path"
              git add -- "$path"
              echo "Kept main version: $path"
            else
              git add -- "$path" || git rm -f -- "$path" || true
              echo "Staged edge conflict: $path"
            fi
          done < <(git diff --name-only --diff-filter=U)

          if [[ "$both" -ne 0 ]]; then
            git rebase --abort || true
            echo "rebase_ok=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          GIT_EDITOR=true git rebase --continue
          echo "rebase_ok=true" >> "$GITHUB_OUTPUT"

      - name: Docs CI
        run: |
          set -euo pipefail
          required=(
            README.md
            docs/concept.md
            docs/design-notes.md
            docs/question-design.md
            docs/recommendation-engine.md
            docs/architecture.md
            docs/roadmap.md
          )
          for f in "${required[@]}"; do
            test -f "$f"
            echo "OK $f"
          done
          mapfile -t links < <(grep -oE '\[[^\]]+\]\((docs/[^)]+|[A-Za-z0-9_./-]+\.md)\)' README.md | sed -E 's/.*\((.*)\)/\1/' | sort -u || true)
          for link in "${links[@]:-}"; do
            [[ -z "${link:-}" ]] && continue
            path="${link%%#*}"
            test -f "$path"
            echo "Linked OK $path"
          done
          grep -q 'design-notes.md' docs/concept.md

      - name: Fast-forward main
        run: |
          set -euo pipefail
          # Feature branch is rebased on main; push as fast-forward to main.
          git push origin "HEAD:main"
          echo "Merged ${GITHUB_REF_NAME} -> main at $(git rev-parse --short HEAD)"

      - name: Update feature branch tip (optional sync)
        run: |
          set -euo pipefail
          git push origin "HEAD:${GITHUB_REF_NAME}" || true

      - name: Open issue on rebase failure
        if: failure() && steps.rebase.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TITLE="Ship blocked: conflicts on ${GITHUB_REF_NAME}"
          BODY=$(printf '%s\n' \
            "Auto-rebase onto main failed because both sides modified the same file(s)." \
            "" \
            "Branch: \`${GITHUB_REF_NAME}\`" \
            "Commit: ${GITHUB_SHA}" \
            "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            "" \
            "Resolve locally:" \
            "" \
            '```bash' \
            "git fetch origin" \
            "git checkout ${GITHUB_REF_NAME}" \
            "git rebase origin/main" \
            "# fix conflicts" \
            "git push --force-with-lease" \
            '```')
          gh issue create --title "$TITLE" --body "$BODY" || echo "Could not open issue"
